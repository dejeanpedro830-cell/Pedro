<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Pedro.online Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">P</span> Pedro<span>.online</span> Store</a><a class="btn btn-quiet" href="login.html">Log in</a></header><main class="auth-shell"><section class="auth-card"><p class="eyebrow">START YOUR BUSINESS</p><h1>Create your store</h1><p class="muted">Set up a demo account to manage products and orders.</p><div class="notice">Starter version: account data is saved in this browser only. Do not use a real password or sensitive customer information.</div><form id="signupForm"><div class="field"><label>Your name</label><input name="name" required maxlength="80" autocomplete="name"></div><div class="field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Store name</label><input name="store" required maxlength="80" placeholder="e.g. Pedro Sneakers"></div><div class="field"><label>Password (demo only)</label><input name="password" type="password" minlength="4" required autocomplete="new-password"></div><div id="message" class="notice hidden"></div><button class="btn btn-gold full" type="submit">Create account →</button></form><p class="muted" style="font-size:13px;text-align:center">Already have an account? <a href="login.html" style="color:var(--gold)">Log in</a></p></section></main><script src="app.js"></script></body></html>
